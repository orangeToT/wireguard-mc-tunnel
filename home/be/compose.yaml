services:
  minecraft:
    image: itzg/minecraft-bedrock-server:latest
    # container_name: bedrock
    network_mode: host
    environment:
      EULA: "TRUE"
      SERVER_NAME: "Bedrock Server"
      GAMEMODE: "survival"
      DIFFICULTY: "normal"
      ALLOW_LIST: "true"
      ONLINE_MODE: "true"
    volumes:
      - ./data:/data
    restart: unless-stopped
