services:
  minecraft:
    image: itzg/minecraft-bedrock-server:latest
    container_name: minecraft-bedrock
    network_mode: host
    environment:
      EULA: "TRUE"
      SERVER_NAME: "${SERVER_NAME:-Bedrock Server}"
      GAMEMODE: "${GAMEMODE:-survival}"
      DIFFICULTY: "${DIFFICULTY:-normal}"
      ALLOW_LIST: "${ALLOW_LIST:-true}"
      ONLINE_MODE: "${ONLINE_MODE:-true}"
    volumes:
      - ./data:/data
    restart: unless-stopped

  minecraft-java:
    profiles: [java]
    image: itzg/minecraft-server:latest
    container_name: minecraft-java
    network_mode: host
    environment:
      EULA: "${JAVA_EULA:-FALSE}"
      TYPE: "VANILLA"
      VERSION: "${JAVA_VERSION:-LATEST}"
      SERVER_PORT: "25565"
      MOTD: "${JAVA_MOTD:-Java Server}"
      MODE: "${JAVA_MODE:-survival}"
      DIFFICULTY: "${JAVA_DIFFICULTY:-normal}"
      ONLINE_MODE: "TRUE"
      ENABLE_WHITELIST: "TRUE"
      WHITELIST: "${JAVA_WHITELIST:-}"
      ENABLE_RCON: "FALSE"
      MEMORY: "${JAVA_MEMORY:-1G}"
    volumes:
      - ./java-data:/data
    restart: unless-stopped
